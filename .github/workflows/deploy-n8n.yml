name: deploy n8n

# Lives in this repo rather than its own since it's an off-the-shelf image, not
# something we build. See docs/new-project.md for a real app repo's caller workflow.
on:
  push:
    branches: [main]
    paths:
      - projects/n8n/compose.yml
      - projects/n8n/secrets.enc.env

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      project: n8n
      compose-path: projects/n8n/compose.yml
      secrets-path: projects/n8n/secrets.enc.env
      host: n8n.waqasali.dev
      health-path: /healthz
      expect-status: "200"
      build: false
    secrets:
      SSH_HOST: ${{ secrets.HUB_SSH_HOST }}
      SSH_KEY: ${{ secrets.HUB_SSH_KEY }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
