name: deploy open-notebook

# Like FreshRSS and ynab-mcp, this lives in the hub repo rather than its own:
# upstream images wired together by a compose file, with nothing to build.
on:
  push:
    branches: [main]
    paths:
      - projects/open-notebook/compose.yml
      - projects/open-notebook/secrets.enc.env

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      project: open-notebook
      compose-path: projects/open-notebook/compose.yml
      secrets-path: projects/open-notebook/secrets.enc.env
      host: notebook.waqasali.dev
      # `/` is the login page. The app's own /health is not routed — Next.js
      # only rewrites /api/*, and /health sits outside that prefix. A first
      # deploy can outlast the verify step's 60s of retries while the frontend
      # and the database warm up; check `make ps` before assuming it failed.
      build: false
    secrets:
      SSH_HOST: ${{ secrets.HUB_SSH_HOST }}
      SSH_KEY: ${{ secrets.HUB_SSH_KEY }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
