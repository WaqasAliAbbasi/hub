name: deploy ynab-mcp

# Like FreshRSS, this lives in the hub repo rather than its own: it is two
# upstream images wired together by a compose file, with nothing to build.
on:
  push:
    branches: [main]
    paths:
      - projects/ynab-mcp/compose.yml
      - projects/ynab-mcp/secrets.enc.env

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      project: ynab-mcp
      compose-path: projects/ynab-mcp/compose.yml
      secrets-path: projects/ynab-mcp/secrets.enc.env
      host: ynab.waqasali.dev
      # / is a 404 on this server even when healthy; /health is its own endpoint.
      health-path: /health
      expect-status: "200"
      build: false
    secrets:
      SSH_HOST: ${{ secrets.HUB_SSH_HOST }}
      SSH_KEY: ${{ secrets.HUB_SSH_KEY }}
      SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
