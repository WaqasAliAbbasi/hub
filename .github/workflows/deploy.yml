name: deploy

# Reusable workflow for shipping a project onto the hub box — see docs/new-project.md
# for the calling side. compose.yml must reference its image as
# `ghcr.io/<repo>:${IMAGE_TAG}`; this substitutes IMAGE_TAG with the git SHA, so a
# rollback is just re-running an old workflow run.
on:
  workflow_call:
    inputs:
      project:
        description: "Directory name under /srv on the box, and the compose project name"
        required: true
        type: string
      compose-path:
        description: "Path to the compose file in the calling repo"
        required: false
        type: string
        default: compose.yml
      host:
        description: "Hostname the app serves (e.g. rss.waqasali.dev), used for the post-deploy healthcheck"
        required: true
        type: string
      health-path:
        description: "Path to probe after deploying. Use a real health endpoint — many apps 404 on / even when perfectly healthy."
        required: false
        type: string
        default: /
      expect-status:
        description: "Shell glob the HTTP status must match. Default is any 2xx/3xx; set e.g. 401 for an endpoint that is meant to reject unauthenticated probes."
        required: false
        type: string
        default: "[23][0-9][0-9]"
      build:
        description: "Build and push an image from this repo. Set false for a compose file that only references pre-built images (e.g. an upstream project like FreshRSS)."
        required: false
        type: boolean
        default: true
      secrets-path:
        description: "Path to a sops-encrypted env file in the calling repo. Decrypted to /srv/<project>/.env if SOPS_AGE_KEY is supplied. Skipped when the file does not exist."
        required: false
        type: string
        default: secrets.enc.env
    secrets:
      SSH_HOST:
        required: true
      SSH_KEY:
        required: true
      SOPS_AGE_KEY:
        description: "Age private key that can decrypt secrets-path. Only needed by projects that have secrets."
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: inputs.build
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects uppercase tags; github.repository preserves repo casing.
      - name: Compute image name
        if: inputs.build
        id: image
        env:
          REPO: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        if: inputs.build
        uses: docker/setup-buildx-action@v3

      # GHA cache: no registry storage, nothing to prune by hand. mode=max caches
      # every intermediate stage, not just the final one, so an unchanged `npm ci`
      # or `next build` layer actually skips on the next deploy.
      - name: Build and push image
        if: inputs.build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Ship compose file and deploy
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          SECRETS_PATH: ${{ inputs.secrets-path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/id_deploy <<< "${{ secrets.SSH_KEY }}"
          # Pinned host key (public material) — accept-new never verifies anything
          # on a fresh runner, and secrets get piped over this connection. Regenerate
          # with `ssh-keyscan -t ed25519 $(make ip)` if the box is ever rebuilt.
          echo "* ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDkA0BC46gKSRuDv+QLr7GLoBUhKlDJJtEyEoztQJc+W" > ~/.ssh/known_hosts
          ssh_opts="-o StrictHostKeyChecking=yes -i ~/.ssh/id_deploy"

          # GHCR packages pushed with GITHUB_TOKEN default to private, and the box
          # has no other credential to pull them — log in fresh each time with the
          # run-scoped token rather than a durable PAT. That token expires with the
          # run, so a build:false project (relying on anonymous pulls of a public
          # image) must log back out — otherwise Docker keeps sending the stale
          # credential and GHCR returns "denied" instead of falling back to anonymous.
          if [ "${{ inputs.build }}" = "true" ]; then
            echo "==> logging the box in to ghcr.io to pull the image just pushed"
            echo "$GH_TOKEN" | ssh $ssh_opts "deploy@${{ secrets.SSH_HOST }}" \
              "docker login ghcr.io -u '$GH_ACTOR' --password-stdin"
          else
            ssh $ssh_opts "deploy@${{ secrets.SSH_HOST }}" "docker logout ghcr.io" || true
          fi

          envsubst '$IMAGE_TAG' < "${{ inputs.compose-path }}" > /tmp/compose.yml

          # Pre-create `data` as `deploy` — otherwise Docker creates a missing
          # bind-mount source as root, unwritable by a non-root container.
          ssh $ssh_opts "deploy@${{ secrets.SSH_HOST }}" \
            "mkdir -p /srv/${{ inputs.project }}/data"
          scp $ssh_opts /tmp/compose.yml "deploy@${{ secrets.SSH_HOST }}:/srv/${{ inputs.project }}/compose.yml"

          # Plaintext pipes straight to a 0600 file on the box; never touches the runner's disk.
          if [ -f "$SECRETS_PATH" ] && [ -n "${SOPS_AGE_KEY:-}" ]; then
            echo "==> decrypting $SECRETS_PATH to /srv/${{ inputs.project }}/.env"
            curl -fsSL -o /tmp/sops \
              https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
            # This binary is handed the age key and every project secret — verify it
            # against the checksum from the upstream release before executing.
            echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  /tmp/sops" | sha256sum -c -
            chmod +x /tmp/sops
            /tmp/sops -d "$SECRETS_PATH" | ssh $ssh_opts "deploy@${{ secrets.SSH_HOST }}" \
              "umask 077 && cat > /srv/${{ inputs.project }}/.env"
          elif [ -f "$SECRETS_PATH" ]; then
            echo "$SECRETS_PATH exists but no SOPS_AGE_KEY was passed to this workflow" >&2
            exit 1
          fi

          ssh $ssh_opts "deploy@${{ secrets.SSH_HOST }}" \
            "cd /srv/${{ inputs.project }} && docker compose pull && docker compose up -d --remove-orphans"

      # Checks that *this app* is serving — Traefik's own 404 for an unrouted host
      # looks the same as "not 000", so a crash-looping container could pass otherwise.
      - name: Verify
        env:
          URL: https://${{ inputs.host }}${{ inputs.health-path }}
          EXPECT: ${{ inputs.expect-status }}
        run: |
          set -eu
          code=000
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)
            case "$code" in
              $EXPECT) echo "==> $URL responded $code"; exit 0 ;;
            esac
            echo "    $URL -> $code, retrying"
            sleep 3
          done
          echo "$URL never returned $EXPECT after 60s (last: $code)" >&2
          exit 1
