name: deploy

# Reusable workflow for shipping a project onto the hub box. An app repo calls
# this in ~10 lines instead of reimplementing build/push/ship/verify itself —
# see docs/new-project.md for the calling side.
#
# The app repo's compose.yml must reference its image as
# `ghcr.io/<repo>:${IMAGE_TAG}` — this workflow substitutes IMAGE_TAG with the
# git SHA before shipping it, so every deploy is pinned to a specific build
# and a rollback is just re-running an old workflow run.
on:
  workflow_call:
    inputs:
      project:
        description: "Directory name under /srv on the box, and the compose project name"
        required: true
        type: string
      compose-path:
        description: "Path to the compose file in the calling repo"
        required: false
        type: string
        default: compose.yml
      host:
        description: "Hostname the app serves (e.g. rss.waqasali.dev), used for the post-deploy healthcheck"
        required: true
        type: string
      health-path:
        description: "Path to probe after deploying. Use a real health endpoint — many apps 404 on / even when perfectly healthy."
        required: false
        type: string
        default: /
      expect-status:
        description: "Shell glob the HTTP status must match. Default is any 2xx/3xx; set e.g. 401 for an endpoint that is meant to reject unauthenticated probes."
        required: false
        type: string
        default: "[23][0-9][0-9]"
      build:
        description: "Build and push an image from this repo. Set false for a compose file that only references pre-built images (e.g. an upstream project like FreshRSS)."
        required: false
        type: boolean
        default: true
      secrets-path:
        description: "Path to a sops-encrypted env file in the calling repo. Decrypted to /srv/<project>/.env if SOPS_AGE_KEY is supplied. Skipped when the file does not exist."
        required: false
        type: string
        default: secrets.enc.env
    secrets:
      SSH_HOST:
        required: true
      SSH_KEY:
        required: true
      SOPS_AGE_KEY:
        description: "Age private key that can decrypt secrets-path. Only needed by projects that have secrets."
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        if: inputs.build
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR rejects any tag with an uppercase letter in it, and
      # `github.repository` preserves the repo's own casing — so a repo like
      # StudentBase/StudentBase fails the push with "repository name must be
      # lowercase". Every caller so far used `build: false`, which is why this
      # never surfaced.
      - name: Compute image name
        if: inputs.build
        id: image
        env:
          REPO: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPO,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        if: inputs.build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:sha-${{ github.sha }}

      - name: Ship compose file and deploy
        env:
          IMAGE_TAG: sha-${{ github.sha }}
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          SECRETS_PATH: ${{ inputs.secrets-path }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          set -eu
          install -m 700 -d ~/.ssh
          install -m 600 /dev/stdin ~/.ssh/id_deploy <<< "${{ secrets.SSH_KEY }}"
          ssh_opts="-o StrictHostKeyChecking=accept-new -i ~/.ssh/id_deploy"

          # A GHCR package pushed with GITHUB_TOKEN defaults to private, and the
          # box otherwise has no credential to pull what was just built — this
          # was the first `build: true` caller to hit it. GITHUB_TOKEN is
          # already scoped to this run and expires when the job ends, so
          # logging in fresh before every pull (rather than a durable PAT) costs
          # nothing extra to rotate and leaves nothing standing between deploys.
          if [ "${{ inputs.build }}" = "true" ]; then
            echo "==> logging the box in to ghcr.io to pull the image just pushed"
            echo "$GH_TOKEN" | ssh $ssh_opts "deploy@${{ secrets.SSH_HOST }}" \
              "docker login ghcr.io -u '$GH_ACTOR' --password-stdin"
          fi

          envsubst '$IMAGE_TAG' < "${{ inputs.compose-path }}" > /tmp/compose.yml

          # `data` alongside: Docker would otherwise create a missing bind-mount
          # source as root, which a container running as a non-root user cannot
          # write to. Created by `deploy`, which owns the rest of /srv/<project>.
          ssh $ssh_opts "deploy@${{ secrets.SSH_HOST }}" \
            "mkdir -p /srv/${{ inputs.project }}/data"
          scp $ssh_opts /tmp/compose.yml "deploy@${{ secrets.SSH_HOST }}:/srv/${{ inputs.project }}/compose.yml"

          # Only projects that have both an encrypted file and the key to open it.
          # The plaintext is piped straight to a 0600 file on the box and never
          # written to the runner's disk.
          if [ -f "$SECRETS_PATH" ] && [ -n "${SOPS_AGE_KEY:-}" ]; then
            echo "==> decrypting $SECRETS_PATH to /srv/${{ inputs.project }}/.env"
            curl -fsSL -o /tmp/sops \
              https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
            chmod +x /tmp/sops
            /tmp/sops -d "$SECRETS_PATH" | ssh $ssh_opts "deploy@${{ secrets.SSH_HOST }}" \
              "umask 077 && cat > /srv/${{ inputs.project }}/.env"
          elif [ -f "$SECRETS_PATH" ]; then
            echo "$SECRETS_PATH exists but no SOPS_AGE_KEY was passed to this workflow" >&2
            exit 1
          fi

          ssh $ssh_opts "deploy@${{ secrets.SSH_HOST }}" \
            "cd /srv/${{ inputs.project }} && docker compose pull && docker compose up -d --remove-orphans"

      # Checks that *this app* is serving, not merely that something answered.
      # Traefik terminates TLS for the whole wildcard domain and returns its own
      # 404 when it has no route — which is exactly what a crash-looping
      # container looks like — so "not 000" was passing for a dead deploy.
      - name: Verify
        env:
          URL: https://${{ inputs.host }}${{ inputs.health-path }}
          EXPECT: ${{ inputs.expect-status }}
        run: |
          set -eu
          code=000
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$URL" || true)
            case "$code" in
              $EXPECT) echo "==> $URL responded $code"; exit 0 ;;
            esac
            echo "    $URL -> $code, retrying"
            sleep 3
          done
          echo "$URL never returned $EXPECT after 60s (last: $code)" >&2
          exit 1
