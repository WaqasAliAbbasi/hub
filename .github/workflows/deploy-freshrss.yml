name: deploy freshrss

# Lives in this repo rather than its own since it's an off-the-shelf image, not
# something we build. See docs/new-project.md for a real app repo's caller workflow.
on:
  push:
    branches: [main]
    paths:
      - projects/freshrss/compose.yml

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      project: freshrss
      compose-path: projects/freshrss/compose.yml
      host: read.waqasali.dev
      build: false
    secrets:
      SSH_HOST: ${{ secrets.HUB_SSH_HOST }}
      SSH_KEY: ${{ secrets.HUB_SSH_KEY }}
