name: deploy freshrss

# FreshRSS is the Phase 3 guinea pig (see PLAN.md) — it lives in this repo rather
# than its own because it's an off-the-shelf image, not something we build. This
# is what a real app repo's caller workflow looks like (see docs/new-project.md),
# minus the build step.
on:
  push:
    branches: [main]
    paths:
      - projects/freshrss/compose.yml

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      project: freshrss
      compose-path: projects/freshrss/compose.yml
      host: rss.waqasali.dev
      build: false
    secrets:
      SSH_HOST: ${{ secrets.HUB_SSH_HOST }}
      SSH_KEY: ${{ secrets.HUB_SSH_KEY }}
