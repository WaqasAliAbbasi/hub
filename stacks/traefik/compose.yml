name: platform

services:
  traefik:
    image: traefik:v3.7
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Read-only, but still root-equivalent host access if Traefik is compromised.
      # Hardening step if this box ever hosts something sensitive: a socket proxy
      # exposing only the container-list endpoints.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
      - ./dynamic:/etc/traefik/dynamic:ro
      - ./admin-users:/etc/traefik/admin-users:ro
      # Named volume: Traefik writes acme.json at 0600 and refuses wider permissions.
      - acme:/acme
    networks:
      - edge
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true

volumes:
  acme:

networks:
  edge:
    external: true
