# Traefik static configuration. Changes here need a container restart
# (`make platform`); anything in dynamic/ is watched and reloaded live.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true

  websecure:
    address: ":443"
    http:
      middlewares:
        # Applied to every router; services can override with their own chain.
        - security-headers@file

  # No port mapping in compose.yml — reachable only from the container's own healthcheck.
  internal:
    address: ":8080"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false # nothing routes unless it sets traefik.enable=true
    network: edge
    watch: true

  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  le:
    acme:
      email: waqas.abbasi@outlook.com
      storage: /acme/acme.json
      httpChallenge:
        entryPoint: web

ping:
  entryPoint: internal

log:
  level: INFO

accessLog:
  filters:
    # Successful requests are noise; only errors and slow requests are worth keeping.
    statusCodes:
      - "400-599"
    minDuration: "2s"
