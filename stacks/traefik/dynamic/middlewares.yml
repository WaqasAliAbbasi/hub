# Everything in this directory is parsed by Traefik's file provider, so only put
# real dynamic config here — a stray credentials or notes file would be read as
# config and logged as an error. The basic-auth users file therefore lives one
# level up, at stacks/traefik/admin-users.

http:
  middlewares:
    # Applied globally via the websecure entryPoint in traefik.yml.
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        # preload is deliberately off: it implies submitting waqasali.dev to the
        # browser preload list, which is effectively irreversible.
        stsPreload: false
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin

    # Admin surfaces (Dozzle, Uptime Kuma, Beszel) opt into this on their own
    # router — it is not global like security-headers, so public services never
    # pay for a basic-auth prompt by accident.
    admin-auth:
      basicAuth:
        usersFile: /etc/traefik/admin-users
