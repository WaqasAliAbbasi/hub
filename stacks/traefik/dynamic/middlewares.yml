# Only real dynamic config belongs in this directory — Traefik's file provider
# parses everything here, so a stray file gets logged as a config error. The
# basic-auth users file lives one level up, at stacks/traefik/admin-users.

http:
  middlewares:
    # Applied globally via the websecure entryPoint in traefik.yml.
    security-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: false # off on purpose: submitting to the browser preload list is irreversible
        contentTypeNosniff: true
        frameDeny: true
        referrerPolicy: strict-origin-when-cross-origin

    # Admin surfaces opt in per-router — not global, so public services never
    # get a basic-auth prompt by accident.
    admin-auth:
      basicAuth:
        usersFile: /etc/traefik/admin-users
