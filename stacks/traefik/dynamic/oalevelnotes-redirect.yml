# oalevelnotes.com's static site is retired — apex and www just 301 to
# studentbase.app. No backend container, so the router uses Traefik's noop service.

http:
  routers:
    oalevelnotes-redirect:
      rule: "Host(`oalevelnotes.com`) || Host(`www.oalevelnotes.com`)"
      entryPoints:
        - websecure
      tls:
        certResolver: le
      middlewares:
        - oalevelnotes-redirect@file
      service: noop@internal

  middlewares:
    oalevelnotes-redirect:
      redirectRegex:
        regex: "^https://(?:www\\.)?oalevelnotes\\.com/(.*)"
        replacement: "https://studentbase.app/${1}"
        permanent: true
