name: ynab-mcp

# One container. It's its own OAuth 2.1 Authorization Server (Dynamic Client
# Registration + PKCE via the MCP SDK), so Traefik only terminates TLS and routes.
# Auth is YNAB's own OAuth — no long-lived Personal Access Token on this box.
services:
  ynab-mcp:
    # Digest-pinned — tags are mutable, and this image holds OAuth write access
    # to a real budget. Upgrading is a deliberate edit of this line.
    image: ghcr.io/auzroz/ynab-mcp:0.3.3@sha256:62df761651a2c33c9945bb68a590c25deeae35830de5f205955b6524c34ff673
    restart: always
    # Image's own `mcp` user (uid 1001) can't write to ./data, owned by `deploy`
    # (uid 1000, no sudo) — run as the owner instead.
    user: "1000:1000"
    # YNAB_OAUTH_CLIENT_ID, YNAB_OAUTH_CLIENT_SECRET, ENCRYPTION_KEY (openssl rand
    # -base64 32; rotating it orphans every stored token).
    env_file: .env
    environment:
      - MCP_TRANSPORT=http
      - PORT=3000
      - PUBLIC_URL=https://ynab.waqasali.dev
      # Both needed: YNAB_READ_ONLY is the server-wide switch (defaults true);
      # ALLOW_WRITE only widens what's offered at YNAB's consent screen.
      - YNAB_READ_ONLY=false
      - YNAB_OAUTH_ALLOW_WRITE=true
      - STORAGE_DRIVER=sqlite # `memory` (default) loses tokens on restart
      - SQLITE_PATH=/data/ynab-mcp.db
      - ENABLE_DNS_REBINDING_PROTECTION=true
      - ALLOWED_HOSTS=ynab.waqasali.dev
      - ALLOWED_ORIGINS=https://ynab.waqasali.dev
      - TRUST_PROXY=1 # one hop (Traefik), else rate limiting buckets by its IP
    volumes:
      - ./data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.ynab-mcp.rule=Host(`ynab.waqasali.dev`)
      - traefik.http.routers.ynab-mcp.tls.certresolver=le
      - traefik.http.services.ynab-mcp.loadbalancer.server.port=3000
      # Not admin-auth@file: a basic-auth 401 breaks Claude's OAuth handshake.
    networks:
      - edge
    mem_limit: 256m
    security_opt:
      - no-new-privileges:true

networks:
  edge:
    external: true
