name: freshrss

services:
  freshrss:
    # Digest-pinned: `latest` would silently ship whatever the registry serves at
    # the next deploy. Upgrading is a deliberate edit of this line.
    image: freshrss/freshrss:1.29.1@sha256:ab6b363102ccdbc39f6a62db926f567c61a5289bf25ba460f1c34423d8cc1a4d
    restart: always
    environment:
      - TZ=UTC
      - CRON_MIN=1,31
    volumes:
      - ./data:/var/www/FreshRSS/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.freshrss.rule=Host(`read.waqasali.dev`)
      - traefik.http.routers.freshrss.tls.certresolver=le
      - traefik.http.services.freshrss.loadbalancer.server.port=80
    networks:
      - edge
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true

networks:
  edge:
    external: true
