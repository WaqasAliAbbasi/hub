name: n8n

services:
  n8n:
    # Digest-pinned: `latest` would silently ship whatever the registry serves at
    # the next deploy. Upgrading is a deliberate edit of this line.
    image: n8nio/n8n:2.34.1@sha256:b69bcc167595df7fe151b316210f56f5fd527fff06dc6a36bcbaa68249640e15
    restart: always
    # N8N_ENCRYPTION_KEY comes from here — losing it orphans every stored credential.
    env_file: .env
    environment:
      - N8N_HOST=n8n.waqasali.dev
      - N8N_PROTOCOL=https
      - N8N_WEBHOOK_URL=https://n8n.waqasali.dev/
      - N8N_PROXY_HOPS=1 # one hop (Traefik), else client IPs resolve to Traefik's own
      - GENERIC_TIMEZONE=Asia/Hong_Kong
    volumes:
      - ./data:/home/node/.n8n
    labels:
      - traefik.enable=true
      - traefik.http.routers.n8n.rule=Host(`n8n.waqasali.dev`)
      - traefik.http.routers.n8n.tls.certresolver=le
      - traefik.http.services.n8n.loadbalancer.server.port=5678
      # Not admin-auth@file: n8n has its own owner login, and a basic-auth 401
      # in front would also block inbound webhooks that external services call.
    networks:
      - edge
    mem_limit: 1g
    security_opt:
      - no-new-privileges:true

networks:
  edge:
    external: true
